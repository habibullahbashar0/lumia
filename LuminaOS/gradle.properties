<!-- LuminaOS Gradle Properties -->

# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the command line, check
# build.gradle files instead.

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# When set to true the Gradle daemon is used to build the project, and stays alive when the build
# finishes.
org.gradle.daemon=true

# AndroidX package structure to make it's clearer which packages are being used
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Use new packaging scheme for APK/AAB
android.newPackagingScheme=true

# Enable jetifier to migrate 3rd party libraries
android.enableJetifier=true

# Gradle Memory
org.gradle.jvmargs=-Xmx4096m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin incremental compilation
kotlin.incremental=true

# Android plugin DSL cache
android.enableBuildCache=true

# Suppress warnings
android.suppressUnsupportedCompileSdk=34

# Enable file system watching
org.gradle.file.watch.enabled=true
